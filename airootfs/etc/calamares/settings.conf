---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - networkcfg
      - hwclock
      - initcpiocfg
      - initcpio
      - removeuser
      - services-openrc
      - displaymanager
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: default
prompt-at-end: true
